<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>BiOX - Iniciar sesión</title>

    <link rel="stylesheet" href="css/styles.css">

    <script defer src="js/session.js"></script>
    <script defer src="js/controllers/login.client.controller.js"></script>
</head>

<body class="login-body">
    <main class="login-page">
        <a class="login-brand" href="/index.html" aria-label="BIOX, inicio">
            BI<span>OX</span>
        </a>

        <section class="card login-card" aria-labelledby="login-title">
            <p class="login-eyebrow">PANEL OPERACIONAL · VÉRTIGO</p>
            <h1 id="login-title">Iniciar sesión</h1>
            <p class="login-intro">Ingresa con tu cuenta para acceder a tus módulos autorizados.</p>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="login-email">Correo electrónico</label>
                    <input
                        type="email"
                        id="login-email"
                        placeholder="nombre@empresa.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input
                        type="password"
                        id="login-password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button class="btn btn-primary" type="submit">Ingresar</button>

                <button
                    class="btn btn-secondary"
                    type="button"
                    id="btn-forgot-password"
                >
                    ¿Olvidaste tu contraseña?
                </button>

                <p
                    id="login-message"
                    class="message"
                    role="status"
                    aria-live="polite"
                ></p>
            </form>
        </section>

        <p class="login-footer">BIOX · Gestión operacional</p>
    </main>
</body>
</html>
